name: ci
on:
  pull_request:
  # The push to main is the run that writes the Gradle cache, which every pull request reads:
  # setup-gradle writes only from the default branch, and a pull request's own cache sits
  # under a ref no other branch can see
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check line endings against .gitattributes
        run: git add --renormalize . && git diff --cached --exit-code --stat
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
