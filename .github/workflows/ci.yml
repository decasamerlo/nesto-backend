name: ci
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check line endings against .gitattributes
        run: git add --renormalize . && git diff --cached --exit-code --stat
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: ./gradlew build
